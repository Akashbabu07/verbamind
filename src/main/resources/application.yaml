spring:
  application:
    name: verbamind
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        ai.embedding.latency: true
        ai.completion.latency: true
        ai.hybrid_search.latency: true
        ai.rag_query.latency: true
        ai.document_ingestion.latency: true
      percentiles:
        ai.embedding.latency: 0.5, 0.95, 0.99
        ai.completion.latency: 0.5, 0.95, 0.99
        ai.hybrid_search.latency: 0.5, 0.95, 0.99
        ai.rag_query.latency: 0.5, 0.95, 0.99
        ai.document_ingestion.latency: 0.5, 0.95, 0.99

logging:
  level:
    com.verbamind: DEBUG
    org.springframework.web: INFO