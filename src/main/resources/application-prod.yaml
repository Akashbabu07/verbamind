spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

verbamind:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  mail:
    from: ${MAIL_USERNAME}
    verification-base-url: ${APP_BASE_URL}/api/auth/verify-email
    reset-base-url: ${APP_BASE_URL}/api/auth/reset-password
    invite-base-url: ${APP_BASE_URL}/api/organizations/members/accept-invite

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    region: ${MINIO_REGION}
    bucket: ${MINIO_BUCKET:verbamind-prod}
  ai:
    provider: ${AI_PROVIDER:gemini}
    openai:
      api-key: ${OPENAI_API_KEY}
    gemini:
      api-key: ${GEMINI_API_KEY}
    groq:
      api-key: ${GROQ_API_KEY}
      embedding-model: ${GROQ_EMBEDDING_MODEL:nomic-embed-text-v1_5}
      chat-model: ${GROQ_CHAT_MODEL:llama-3.3-70b-versatile}

  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

logging:
  level:
    com.verbamind: INFO